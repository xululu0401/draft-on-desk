<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#f4f3ef"/>
  <rect x="70" y="60" width="1060" height="1080" rx="18" fill="#fff" stroke="#dcdbd2" stroke-width="3"/>
  <text x="140" y="200" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="104" font-weight="800" fill="#22231f">桌上那份初稿</text>
  <text x="140" y="268" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" fill="#53554d">交给新人做，他的初稿不如你，要不要自己重写</text>
  <rect x="140" y="298" width="920" height="5" fill="#22231f"/>
  <text x="140" y="378" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="800" fill="#22231f">每周一份、做 12 次：忍住只给意见 <tspan fill="#a3473a">533 分钟</tspan></text>
  <text x="140" y="436" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#53554d">看不顺眼就重写 809 分钟 · 自己做 1,080 分钟 · 第 4 次起省</text>
  <line x1="200" x2="1040" y1="930" y2="930" stroke="#53554d" stroke-width="2"/>
  <polyline fill="none" stroke="#8a6d1f" stroke-width="8" stroke-linejoin="round" stroke-dasharray="18 12" points="200.0,930.0 270.0,895.8 340.0,861.7 410.0,827.5 480.0,793.3 550.0,759.2 620.0,725.0 690.0,690.8 760.0,656.7 830.0,622.5 900.0,588.3 970.0,554.2 1040.0,520.0"/><polyline fill="none" stroke="#2f5b8a" stroke-width="8" stroke-linejoin="round" points="200.0,884.4 270.0,861.7 340.0,838.9 410.0,816.1 480.0,793.3 550.0,770.6 620.0,747.8 690.0,725.0 760.0,702.2 830.0,679.4 900.0,656.7 970.0,638.1 1040.0,622.9"/><polyline fill="none" stroke="#2f7a4a" stroke-width="8" stroke-linejoin="round" points="200.0,884.4 270.0,856.0 340.0,833.2 410.0,814.6 480.0,799.4 550.0,786.5 620.0,775.5 690.0,765.6 760.0,756.9 830.0,748.9 900.0,741.3 970.0,734.5 1040.0,727.7"/><text x="1032" y="502" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="800" fill="#8a6d1f" stroke="#fff" stroke-width="10" paint-order="stroke" stroke-linejoin="round" text-anchor="end">自己做到底 1,080 分钟</text><text x="1032" y="600.8796296296296" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="800" fill="#2f5b8a" stroke="#fff" stroke-width="10" paint-order="stroke" stroke-linejoin="round" text-anchor="end">看不顺眼就重写 809 分钟</text><text x="1032" y="793.6574074074074" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="800" fill="#2f7a4a" stroke="#fff" stroke-width="10" paint-order="stroke" stroke-linejoin="round" text-anchor="end">一次都不重写 533 分钟</text>
  <text x="200" y="976" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#878a80">开始</text>
  <text x="1040" y="976" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#878a80" text-anchor="end">第 12 次</text>
  <text x="140" y="1050" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#22231f">纵轴 = 累计花你多少分钟（越低越省）</text>
  <text x="140" y="1100" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#878a80">只算你自己花的分钟 · 学得多快是你自己的估计 · 数字均为虚构示例</text>
</svg>